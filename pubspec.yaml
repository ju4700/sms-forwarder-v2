name: sms_forwarder_v2
description: "SMS forwarder and default SMS app for bKash, Nagad, Rocket, and Bank transaction messages."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  connectivity_plus: ^6.1.5
  drift: ^2.22.0
  google_fonts: ^6.2.1
  http: ^1.2.2
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  path: ^1.9.0
  path_provider: ^2.1.5
  permission_handler: ^11.4.0
  sqlite3_flutter_libs: ^0.5.26

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.12
  drift_dev: ^2.22.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
